services:
  web:
    image: ${APP_IMAGE:-simple-docker-flask-app:local}
    ports:
      - "${WEB_PORT:-8080}:5000"
    environment:
      - APP_NAME=${APP_NAME}
      - APP_COLOR=${APP_COLOR}
      - APP_ENV=${APP_ENV}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - study-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - study-net

networks:
  study-net:

volumes:
  redis-data: