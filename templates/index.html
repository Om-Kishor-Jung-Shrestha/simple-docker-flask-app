<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border-top: 6px solid {{ app_color }};
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { margin-top: 0; color: {{ app_color }}; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    td { padding: 0.4rem 0; border-bottom: 1px solid #334155; }
    td:first-child { color: #94a3b8; }
    td:last-child { text-align: right; font-family: monospace; }
    .badge {
      display: inline-block;
      background: {{ app_color }};
      color: white;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ app_name }}</h1>
    <span class="badge">{{ app_env }}</span>
    <table>
      <tr><td>Container hostname</td><td>{{ hostname }}</td></tr>
      <tr><td>Redis service</td><td>{{ redis_host }}:{{ redis_port }}</td></tr>
      <tr><td>Total visits</td><td>{{ visits }}</td></tr>
    </table>
  </div>
</body>
</html>
