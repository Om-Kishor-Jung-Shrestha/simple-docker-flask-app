name: CI

# Study point: workflow triggers. "push" runs on every push to main,
# "pull_request" runs on PRs targeting main -- so you get feedback
# before merging, not just after.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hadolint catches Dockerfile anti-patterns (e.g. missing --no-cache-dir,
      # running as root, unpinned base image tags) before you ever build.
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build-and-test:
    name: Build & smoke-test
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Pins the Compose project name so container names are predictable
      # (docker-study-app-web-1) regardless of what the checkout folder
      # happens to be called.
      COMPOSE_PROJECT_NAME: docker-study-app
    steps:
      - uses: actions/checkout@v4

      # Buildx gives layer caching between runs, so repeat CI runs don't
      # re-download/reinstall requirements.txt from scratch every time.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: docker-study-app:ci
          load: true                     # make the image available to `docker run` below
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Study point: this brings up the FULL stack (web + redis) exactly
      # the way a student would locally with `docker compose up`, using
      # the image we just built instead of rebuilding it.
      - name: Boot the stack with Docker Compose
        run: docker compose up -d
        env:
          APP_NAME: CI Test Run
          APP_ENV: ci

      - name: Wait for web service to become healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' docker-study-app-web-1 2>/dev/null || echo "starting")
            echo "web status: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "web never became healthy"
          docker compose logs
          exit 1

      - name: Hit the app
        run: curl --fail http://localhost:8080/

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    # Study point: this job only runs on version tags (e.g. v1.0.0),
    # not on every push -- a common pattern for "build on every commit,
    # publish only on release".
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/docker-study-app:${{ github.ref_name }}-${{ steps.vars.outputs.short_sha }}